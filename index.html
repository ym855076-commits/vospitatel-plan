<style>
:root{--bg:#eef4f4;--card:#fff;--ink:#1d2b2e;--mute:#5b6d70;--brand:#0f5c63;--line:#d3e0e1;--ok:#1e7a46;--bad:#b3261e}
:root[data-theme=dark]{--bg:#121b1d;--card:#1a2629;--ink:#e6eeee;--mute:#9bb0b3;--brand:#66c2c9;--line:#2c3c40;--ok:#2d8a57;--bad:#c9473e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:800px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{flex:1;font-size:18px;margin:0;color:var(--brand)}
button,input,select,textarea{font:inherit;color:var(--ink)}
.sm{padding:7px 11px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--brand)}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border:0}
.today{border-left:4px solid var(--brand);padding-left:8px;border-radius:4px}
.badge{padding:4px 8px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;background:var(--ok)}
.badge.off{background:var(--bad)}
.btn{padding:11px 14px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700;width:100%;margin-top:8px}
:root[data-theme=dark] .btn{color:#06292c}
.btn.alt{background:var(--card);color:var(--brand);border:1px solid var(--brand)}
.mute{color:var(--mute);font-size:13px;font-weight:600;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px}
.cheat{background:rgba(242,182,50,.15);border-left:5px solid #f2b632;padding:12px;border-radius:6px;margin-bottom:12px;font-size:13px}
.cheat ul{margin:4px 0 0;padding-left:18px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.chk{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);overflow:auto;padding:16px;font-size:19px;padding-top:max(16px,env(safe-area-inset-top))}
.chk.on{display:block}
.chk h3{margin:14px 0 4px;color:var(--brand);font-size:17px}
.chk .big{font-size:24px;font-weight:700}
.chk .qa{border-left:4px solid var(--brand);padding-left:10px;margin:8px 0;font-size:17px}
@media print{
:root,:root[data-theme=dark]{--bg:#fff;--card:#fff;--ink:#000;--line:#000;--brand:#000}
.top,.noprint,.cheat,.chk{display:none!important}
body{background:#fff;color:#000;padding:0}
.card{border:0;padding:0;margin:0 0 8px}
}
</style>
</head>

function fill(k){var d=DAY[k][L];g('goal').value=d.g;g('phon').value=phonText(k,L);g('hw').value=d.hw;g('sp').value=speechText(k,L)}
function loadDay(){var k=day(),sv=ls('tp_p_'+L+k);if(sv){try{var o=JSON.parse(sv);g('goal').value=o.g;g('phon').value=o.p;g('hw').value=o.h;g('sp').value=o.s}catch(x){fill(k)}}else fill(k);build(true)}
function save(){ls('tp_p_'+L+day(),JSON.stringify({g:g('goal').value,p:g('phon').value,h:g('hw').value,s:g('sp').value}))}
function resetDay(){try{localStorage.removeItem('tp_p_'+L+day())}catch(x){}fill(day());build(true)}
function fmt(v){var p=v.split('-');return p.length==3?p[2]+'.'+p[1]+'.'+p[0]:v}
function build(quiet){var u=U[L],k=day(),d=DAY[k][L];
 var h='<div class="card"><h2 style="text-align:center">'+e(u.ttl)+'</h2><div style="text-align:center;font-size:13px;margin-bottom:10px"><b>'+u.sn[0]+':</b> '+e(fmt(g('dateIn').value))+'</div><div class="tw"><table><tr><th style="width:25%">'+u.cA+'</th><th>'+u.cB+'</th></tr><tr><td><b>'+e(d.t)+'</b><br><br><small>'+u.cls+'</small></td><td>';
 h+='<b>'+u.goalL+':</b> '+box(g('goal').value)+'<br><br><b>1. '+u.s1+':</b><br><i>'+box(g('phon').value)+'</i><br><br><b>2. '+u.s2+':</b> <i>'+box(g('hw').value)+'</i><br><br><b>3. '+u.s3+':</b><br><i>'+box(g('sp').value)+'</i><br><br><b>'+u.tsk+':</b><ul>';
 tasks(k,L).forEach(function(t,i){h+='<li>'+(i+1)+'. '+e(t[0])+(t[1]?': '+e(t[1]):'')+'</li>'});
 g('out').innerHTML=h+'</ul></td></tr></table></div></div>';
 if(quiet!==true)g('out').scrollIntoView({behavior:'smooth'});}
function copyPlan(){var t=g('out').innerText,b=g('bCp'),u=U[L];
 function ok(){b.textContent=u.copied;setTimeout(function(){b.textContent=u.cp},1500)}
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,fb);else fb();
 function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(x){}a.remove()}}
function chk(on){var c=g('chk');if(!on){c.className='chk';return}var k=day(),d=DAY[k][L],q=Q[L],u=U[L],h='<button class="sm" onclick="chk(0)">✕ '+q.c+'</button><h3>'+q.d+'</h3><div class="big">'+e(u.days[k])+' — '+e(d.t)+'</div>';
 h+='<h3>'+q.s+'</h3>'+e(d.ph[0])+' · '+e(d.ph[1])+'<h3>'+q.w+'</h3><span class="big">'+e(d.ph[2])+'</span><h3>'+q.f+'</h3>'+e(d.ph[3])+'<h3>'+q.h+'</h3>'+e(d.hw)+'<h3>'+q.o+'</h3>';
 tasks(k,L).forEach(function(t){h+=e(t[0])+(t[1]?': '+e(t[1]):'')+'<br>'});
 h+='<h3>'+q.q+'</h3>';q.qa.forEach(function(x){h+='<div class="qa"><b>'+e(x[0])+'</b><br>'+e(x[1])+'</div>'});
 c.innerHTML=h;c.className='chk on';c.scrollTop=0}
function setLang(){L=L=='tk'?'ru':'tk';ls('tp_lang',L);render()}
function setTheme(){var r=document.documentElement,d=r.getAttribute('data-theme')=='dark';if(d)r.removeAttribute('data-theme');else r.setAttribute('data-theme','dark');ls('tp_theme',d?'light':'dark')}
L=ls('tp_lang');if(!U[L])L='tk';if(ls('tp_theme')=='dark')document.documentElement.setAttribute('data-theme','dark');
render();
</script>
